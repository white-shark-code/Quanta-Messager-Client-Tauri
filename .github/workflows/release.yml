name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # for creating releases
  id-token: write  # for signing (if configured later)

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - id: create_release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true

  build-desktop:
    name: Build desktop (${{ matrix.os }}-${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: deb
            artifact: quant-linux-deb
          - os: ubuntu-latest
            target: appimage
            artifact: quant-linux-appimage
          - os: macos-latest
            target: app
            artifact: quant-macos-app
          - os: macos-latest
            target: dmg
            artifact: quant-macos-dmg
          - os: windows-latest
            target: msi
            artifact: quant-windows-msi
          - os: windows-latest
            target: nsis
            artifact: quant-windows-nsis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-msvc' || (matrix.os == 'macos-latest' && (startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin' || 'x86_64-unknown-linux-gnu')) }}
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build:tauri -- --bundles ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/*/release/bundle/${{ matrix.target }}/
          if-no-files-found: error

  upload-assets:
    name: Upload release assets
    needs: [create-release, build-desktop]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: quant-linux-deb
            asset_name: quant-linux.deb
          - artifact: quant-linux-appimage
            asset_name: quant-linux.AppImage
          - artifact: quant-macos-app
            asset_name: quant-macos.app
          - artifact: quant-macos-dmg
            asset_name: quant-macos.dmg
          - artifact: quant-windows-msi
            asset_name: quant-windows.msi
          - artifact: quant-windows-nsis
            asset_name: quant-windows.exe
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
      - uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: dist/
          asset_name: ${{ matrix.asset_name }}
          asset_content_type: application/octet-stream
